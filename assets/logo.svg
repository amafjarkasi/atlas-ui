<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Border stroke gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Primary brand text gradient -->
    <linearGradient id="brandText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Mark glow & accent -->
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="24%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      font-weight: 850;
      letter-spacing: -2.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .mono-tag {
      font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.5px;
      dominant-baseline: central;
      text-anchor: middle;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="936" height="256" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="2" y="2" width="936" height="256" rx="20" fill="url(#ambientGlow)"/>

  <!-- Geometric Grid Accent lines inside backdrop -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="40" y1="65" x2="900" y2="65" />
    <line x1="40" y1="130" x2="900" y2="130" />
    <line x1="40" y1="195" x2="900" y2="195" />
    <line x1="220" y1="20" x2="220" y2="240" />
    <line x1="460" y1="20" x2="460" y2="240" />
    <line x1="700" y1="20" x2="700" y2="240" />
  </g>

  <!-- Modern Geometric Atlas Emblem / Mark -->
  <g transform="translate(68, 50)" filter="url(#softGlow)">
    <!-- Outer hexagonal / diamond shield frame -->
    <path d="M 80,0 L 155,42 L 155,118 L 80,160 L 5,118 L 5,42 Z" 
          fill="#0f172a" 
          stroke="url(#markGrad)" 
          stroke-width="2.5" 
          stroke-linejoin="round"
          stroke-opacity="0.85" />
          
    <!-- Inner geometric faceted letter A structure -->
    <path d="M 80,24 L 126,128 L 102,128 L 92,102 L 68,102 L 58,128 L 34,128 Z M 80,56 L 73,88 L 87,88 Z" 
          fill="url(#markGrad)" />

    <!-- Crossbar precision laser accents -->
    <line x1="25" y1="102" x2="135" y2="102" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="80" cy="24" r="3.5" fill="#38bdf8"/>
    <circle cx="34" cy="128" r="3" fill="#818cf8"/>
    <circle cx="126" cy="128" r="3" fill="#c084fc"/>
    <circle cx="80" cy="160" r="3" fill="#38bdf8"/>
  </g>

  <!-- Typography Block -->
  <!-- Main Title -->
  <text x="268" y="108" class="title-text" font-size="64" fill="url(#brandText)">Atlas UI</text>

  <!-- Tagline -->
  <text x="272" y="148" class="sub-text" font-size="16" fill="#94a3b8">
    Native GPU-Accelerated Component Architecture for Desktop
  </text>

  <!-- Pill Badges with generous, balanced padding -->
  <!-- 1. GPUIX EXCLUSIVE (text length ~105px -> rect width 142px) -->
  <g transform="translate(272, 172)">
    <rect width="142" height="30" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <text x="71" y="15" class="mono-tag" fill="#38bdf8">GPUIX EXCLUSIVE</text>
  </g>

  <!-- 2. ZERO DOM / CSS (text length ~88px -> rect width 126px) -->
  <g transform="translate(424, 172)">
    <rect width="126" height="30" rx="7" fill="#0f172a" stroke="#6366f1" stroke-width="1.2"/>
    <text x="63" y="15" class="mono-tag" fill="#a5b4fc">ZERO DOM / CSS</text>
  </g>

  <!-- 3. 200+ COMPONENTS (text length ~100px -> rect width 142px) -->
  <g transform="translate(560, 172)">
    <rect width="142" height="30" rx="7" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="71" y="15" class="mono-tag" fill="#d8b4fe">200+ COMPONENTS</text>
  </g>

  <!-- 4. DX12 · METAL · VULKAN (text length ~140px -> rect width 180px) -->
  <g transform="translate(712, 172)">
    <rect width="180" height="30" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="90" y="15" class="mono-tag" fill="#cbd5e1">DX12 · METAL · VULKAN</text>
  </g>
</svg>
